# Release: minimal, linux/amd64 only.
#
# This is deliberately the smallest correct path, per the maintainer's
# decision: one production GUI binary for linux/amd64, a SHA256SUMS file, a
# build provenance attestation, and a GitHub Release. No arm64, no other OS,
# no code signing, no AppImage.
#
# A push of a tag that matches v* triggers this workflow (for example,
# `git tag v1.0.0 && git push --tags`). The build stamps the binary version
# from the tag, so the tag drives `perch version`. This is why the checkout
# below fetches full history and tags.
#
# The GUI binary builds inside the pinned perch-dev image, the same image the
# test gates use. The image bakes in Node, the WebKitGTK 4.1 and GTK3 dev
# libraries, and the C toolchain, all pinned from .tool-versions and the
# Containerfile. So the release binary and the test gates share one
# toolchain, and the runner installs no build libraries of its own.

name: Release

on:
  push:
    tags:
      - "v*"

# contents: write creates the release and uploads the assets. id-token: write
# and attestations: write let the provenance step sign and store the
# attestation.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    # Fail fast on a hung step instead of running to the 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch full history and tags, so `git describe --tags` resolves the
          # pushed tag into the binary version below.
          fetch-depth: 0
          # The release action uses GITHUB_TOKEN through its own input, not the
          # git config, so do not persist the token.
          persist-credentials: false

      # The pinned Go version comes from .tool-versions, the same source the
      # image reads. The host Go satisfies the Makefile's `command -v go` guard
      # for `make image`.
      - name: Resolve pinned Go version
        id: tools
        run: echo "go=$(awk '$1=="golang"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.tools.outputs.go }}

      # Build the perch-dev image once, so the GUI build below runs inside it.
      - name: Build perch-dev image
        run: make image

      # Build the frontend and the cgo GUI binary inside perch-dev, into
      # bin/perch. The host computes the version from the tag and passes it as
      # a make override. A command-line VERSION overrides the Makefile default,
      # so the build never depends on git ownership inside the container.
      # PERCH_MASK_DIST keeps the build off the checked-out frontend/dist stub.
      # The real frontend still builds into the masked volume and embeds into
      # the binary.
      - name: Build production GUI binary (linux/amd64)
        env:
          PERCH_MASK_DIST: 1
        run: |
          bash containers/run.sh dev make CONTAINERIZE=0 gui-build \
            VERSION="$(git describe --tags --always --dirty)"

      - name: Package binary and checksums
        run: |
          install -m 0755 bin/perch perch-linux-amd64
          sha256sum perch-linux-amd64 > SHA256SUMS
          # Check that the tag flowed into the binary version. Run inside
          # perch-dev, which has the WebKitGTK runtime libraries the binary
          # links against.
          bash containers/run.sh dev ./bin/perch version

      # Build provenance is a signed SLSA attestation. It proves this workflow
      # built these files. It is not code signing. `gh attestation verify`
      # checks a downloaded artifact against this repository.
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            perch-linux-amd64
            SHA256SUMS

      # This third-party action is pinned to a full commit SHA, for
      # supply-chain hardening. The trailing comment records the
      # human-readable version.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            perch-linux-amd64
            SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
