# Release: linux binaries for amd64 and arm64.
#
# This is the smallest correct path, per the maintainer's decision: one
# production GUI binary per linux architecture, a single SHA256SUMS file, a
# build provenance attestation, and a GitHub Release. No macOS, no Windows,
# no code signing, no AppImage.
#
# A push of a tag that matches v* builds both architectures and publishes the
# release (for example, `git tag v1.0.0 && git push --tags`). The build stamps
# the binary version from the tag, so the tag drives `perch version`. This is
# why the checkout below fetches full history and tags.
#
# workflow_dispatch runs the same build on both architectures but publishes
# nothing (the release job is gated on a tag ref). Use it to dry-run the build
# after a change to this workflow or the Containerfile.
#
# Each binary builds inside the pinned perch-dev image, on a runner of its own
# architecture (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm). The image
# bakes in Node, the WebKitGTK 4.1 and GTK3 dev libraries, and the C toolchain,
# all pinned from .tool-versions and the Containerfile. So the release binaries
# and the test gates share one toolchain, and each runner installs no build
# libraries of its own. The builds are native, not cross-compiled, because the
# cgo WebKitGTK binary needs its target's C toolchain and GUI libraries.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The default is read-only. The release job below grants itself the writes it
# needs.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Fail fast on a hung step instead of running to the 6-hour default.
    timeout-minutes: 45
    permissions:
      contents: read
      # Read the CI check run of the tagged commit (gate step below).
      checks: read
    steps:
      # A tag push must not publish a commit that never passed CI. The CI
      # workflow's `gate` job is the required check, so require a successful
      # run of it on this exact commit. If the tag was pushed before CI
      # finished, wait for CI and re-run this workflow.
      - name: Require a passing CI gate on the tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "gate" or .name == "CI / gate")] | sort_by(.completed_at) | last | .conclusion // "none"')"
          echo "CI gate conclusion for ${GITHUB_SHA}: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::CI gate has not passed on ${GITHUB_SHA} (${conclusion}). Refusing to release."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch full history and tags, so `git describe --tags` resolves the
          # pushed tag into the binary version below.
          fetch-depth: 0
          # The build never pushes, so do not persist the token.
          persist-credentials: false

      # The pinned Go version comes from .tool-versions, the same source the
      # image reads. The host Go satisfies the Makefile's `command -v go` guard
      # for `make image`.
      - name: Resolve pinned Go version
        id: tools
        run: echo "go=$(awk '$1=="golang"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.tools.outputs.go }}

      # Build the perch-dev image once, natively for this runner's architecture.
      - name: Build perch-dev image
        run: make image

      # Build the frontend and the cgo GUI binary inside perch-dev, into
      # bin/perch. The host computes the version and passes it as a make
      # override, so the build never depends on git ownership inside the
      # container. A tag run stamps the pushed tag name itself, not `git
      # describe`: describe can pick another tag on the same commit (an
      # annotated v1.0.0-rc1 next to a lightweight v1.0.0), and
      # `install.sh --upgrade` requires the binary to report exactly the
      # release tag. PERCH_MASK_DIST keeps the build off the checked-out
      # frontend/dist stub; the real frontend still builds into the masked
      # volume and embeds into the binary.
      - name: Build production GUI binary (linux/${{ matrix.arch }})
        env:
          PERCH_MASK_DIST: 1
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          bash containers/run.sh dev make CONTAINERIZE=0 gui-build VERSION="${version}"

      - name: Package binary
        run: |
          install -m 0755 bin/perch perch-linux-${{ matrix.arch }}
          # Check that the tag flowed into the binary version. Run inside
          # perch-dev, which has the WebKitGTK runtime libraries the binary
          # links against, on this runner's own architecture.
          out="$(bash containers/run.sh dev ./bin/perch version)"
          echo "$out"
          # Only a tag run must carry the tag, and exactly the tag: the first
          # line must be "perch <tag>" (install.sh --upgrade compares it). A
          # workflow_dispatch dry run builds an arbitrary ref.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            first="$(printf '%s\n' "$out" | head -n 1 | tr -d '\r')"
            if [ "$first" != "perch ${GITHUB_REF_NAME}" ]; then
              echo "::error::perch version reports '${first}', expected 'perch ${GITHUB_REF_NAME}'"
              exit 1
            fi
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: perch-linux-${{ matrix.arch }}
          path: perch-linux-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    # Publish only for a tag push. A workflow_dispatch run stops after build.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # contents: write creates the release and uploads the assets. id-token
      # and attestations let the provenance step sign and store the attestation.
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum perch-linux-* > SHA256SUMS
          cat SHA256SUMS

      # Build provenance is a signed SLSA attestation. It proves this workflow
      # built these files. It is not code signing. `gh attestation verify`
      # checks a downloaded artifact against this repository.
      #
      # GitHub offers artifact attestations free on public repositories. A
      # private repository needs a Team or Enterprise plan for the attestation
      # API, so this step runs only when the repository is public.
      - name: Generate build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/perch-linux-amd64
            dist/perch-linux-arm64
            dist/SHA256SUMS

      # This third-party action is pinned to a full commit SHA, for
      # supply-chain hardening. The trailing comment records the
      # human-readable version.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/perch-linux-amd64
            dist/perch-linux-arm64
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
          # A tag with a pre-release suffix (v1.0.0-rc1) is not a stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
