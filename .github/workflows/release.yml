# Release: minimal, linux/amd64 only.
#
# This is deliberately the smallest correct path, per the maintainer's
# decision: one production GUI binary for linux/amd64, a SHA256SUMS file,
# and a GitHub Release. No arm64, no other OS, no signing, no AppImage.
#
# A push of a tag matching v* triggers this workflow (for example,
# `git tag v1.0.0 && git push --tags`). The Makefile LDFLAGS stamps the
# binary's version from `git describe --tags`, so the tag itself drives
# `perch version`. This is why the checkout below fetches full history and
# tags.
#
# The production GUI binary needs Node (for the frontend build), the
# WebKitGTK 4.1 and GTK3 dev libraries, and a C toolchain (cgo).
# `make gui-build` is not a containerized DZ target, so it runs directly
# here, on the same pinned toolchain versions the perch-dev image uses
# (read from .tool-versions), with the same GUI libraries the image
# installs.

name: Release

on:
  push:
    tags:
      - "v*"

# Creating the release and uploading assets needs write access to the repository contents.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Fetch full history and tags, so the Makefile's `git describe --tags`
          # resolves the pushed tag into main.version.
          fetch-depth: 0

      # The pinned Go and Node versions come from .tool-versions, the same source the image reads.
      - name: Resolve pinned toolchain versions
        id: tools
        run: |
          echo "go=$(awk '$1=="golang"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "node=$(awk '$1=="nodejs"{print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.tools.outputs.go }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.tools.outputs.node }}

      # These are the same GUI build libraries the perch-dev image installs,
      # minus xvfb (xvfb is needed only for a headless GUI smoke test, not to
      # compile). Noble ships the WebKit2GTK 4.1 dev package.
      # libwebkit2gtk-4.1-dev also pulls in libsoup-3.0-dev. Production
      # builds link 4.1 through -tags "production webkit2_41".
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # Build the frontend and the cgo GUI binary -> bin/perch, version stamped from the tag.
      - name: Build production GUI binary (linux/amd64)
        run: make gui-build

      - name: Package binary and checksums
        run: |
          install -m 0755 bin/perch perch-linux-amd64
          sha256sum perch-linux-amd64 > SHA256SUMS
          # Check that the tag flowed into the binary's version string.
          ./perch-linux-amd64 version

      # This third-party action is pinned to a full commit SHA, for
      # supply-chain hardening. The trailing comment records the
      # human-readable version.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            perch-linux-amd64
            SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
